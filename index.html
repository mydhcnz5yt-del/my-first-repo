<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的个人主页</title>
<style>
  body { font-family: "PingFang SC", sans-serif; margin: 0; background: #f6f7fb; color: #1a2233; }
  .hero { text-align: center; padding: 70px 20px; background: linear-gradient(135deg, #1e1b4b, #4f46e5); color: #fff; }
  .avatar { width: 90px; height: 90px; line-height: 90px; margin: 0 auto; border-radius: 50%; background: #f59e0b; font-size: 40px; font-weight: 800; }
  .hero h1 { margin: 16px 0 8px; }
  .hero p { color: #c7d2fe; }
  .card { max-width: 640px; margin: 24px auto; background: #fff; padding: 24px 28px; border-radius: 14px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .tags span { display: inline-block; background: #eef2ff; color: #4338ca; padding: 4px 14px; border-radius: 99px; margin: 4px; font-size: 13px; }
  footer { text-align: center; color: #94a3b8; font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<div class="hero">
  <div class="avatar">我</div>
  <h1>你好，我是你的名字</h1>
  <p>一个正在学习编程的新手</p>
</div>
<div class="card">
  <h2>关于我</h2>
  <p>【改我】写一段你自己的介绍：你是做什么的、为什么学编程、最近在学什么。</p>
</div>
<div class="card">
  <h2>我的技能</h2>
  <div class="tags">
    <span>Git 基础</span><span>GitHub</span><span>HTML</span><span>AI 编程</span>
  </div>
</div>
<div class="card">
  <h2>兴趣爱好</h2>
  <p>【改我】编程、阅读、运动、音乐……写你真实的爱好。</p>
</div>
<div class="card">
  <h2>联系我</h2>
  <p>GitHub：github.com/你的用户名（【改我】换成你的用户名）<br>邮箱：you@example.com（【改我】换成你的邮箱）</p>
</div>
<footer>这是我的第一个 GitHub 项目</footer>
</body>
</html>
